name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Тесты и golden-вектора
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -count=1

      # Golden-вектора — главный смысл этого репозитория. Их расхождение
      # означает, что площадки в поле перестанут принимать профили: подпись
      # либо совпала байт в байт, либо нет, и по логам это почти не отлаживается.
      - name: Golden-вектора
        run: go test ./capability -run TestGolden -count=1 -v
